<form class="search-card" data-copy="formLabel" data-copy-target="aria-label" aria-label="Equipment search">
  <div class="field grow">
    <label for="equipment-query" data-copy="searchEquipment">Search equipment</label>
    <input
      id="equipment-query"
      name="q"
      type="text"
      data-copy="searchPlaceholder"
      data-copy-target="placeholder"
      autocomplete="off"
      aria-autocomplete="list"
      placeholder="Search by model or category"
    >
  </div>
  <div class="search-filters">
    <div class="field sel hours-field">
      <span id="hours-label" data-copy="hours">Hours</span>
      <button
        type="button"
        class="range-trigger"
        id="equipment-hours-trigger"
        aria-expanded="false"
        aria-haspopup="dialog"
        aria-controls="hours-panel"
        aria-labelledby="hours-label"
      >
        <span class="range-trigger-value" data-copy="any">Any</span>
      </button>
      <div class="range-panel" id="hours-panel" hidden role="dialog" aria-labelledby="hours-panel-title">
        <p class="range-panel-title" id="hours-panel-title" data-copy="chooseHoursRange">Choose hours range</p>
        <div class="range-histogram" aria-hidden="true"></div>
        <div class="range-slider">
          <div class="range-rail" aria-hidden="true"><span class="range-rail-active"></span></div>
          <input type="range" class="range-thumb range-thumb-min" id="hours-min-slider" aria-label="Minimum hours">
          <input type="range" class="range-thumb range-thumb-max" id="hours-max-slider" aria-label="Maximum hours">
        </div>
        <div class="range-fields">
          <label class="range-field">
            <input type="text" inputmode="numeric" class="range-min-input" id="hours-min" autocomplete="off">
            <span data-copy="min">Min</span>
          </label>
          <label class="range-field">
            <input type="text" inputmode="numeric" class="range-max-input" id="hours-max" autocomplete="off">
            <span data-copy="max">Max</span>
          </label>
        </div>
      </div>
    </div>
    <div class="field sel price-field">
      <span id="price-label" data-copy="price">Price</span>
      <button
        type="button"
        class="range-trigger"
        id="equipment-price-trigger"
        aria-expanded="false"
        aria-haspopup="dialog"
        aria-controls="price-panel"
        aria-labelledby="price-label"
      >
        <span class="range-trigger-value" data-copy="any">Any</span>
      </button>
      <div class="range-panel" id="price-panel" hidden role="dialog" aria-labelledby="price-panel-title">
        <p class="range-panel-title" id="price-panel-title" data-copy="choosePriceRange">Choose price range</p>
        <div class="range-histogram" aria-hidden="true"></div>
        <div class="range-slider">
          <div class="range-rail" aria-hidden="true"><span class="range-rail-active"></span></div>
          <input type="range" class="range-thumb range-thumb-min" id="price-min-slider" aria-label="Minimum price">
          <input type="range" class="range-thumb range-thumb-max" id="price-max-slider" aria-label="Maximum price">
        </div>
        <div class="range-fields">
          <label class="range-field">
            <input type="text" inputmode="numeric" class="range-min-input" id="price-min" autocomplete="off">
            <span data-copy="min">Min</span>
          </label>
          <label class="range-field">
            <input type="text" inputmode="numeric" class="range-max-input" id="price-max" autocomplete="off">
            <span data-copy="max">Max</span>
          </label>
        </div>
      </div>
    </div>
  </div>
  <button type="submit" class="button accent">
    <span data-copy="search">Search</span>
    <span class="count">0</span>
  </button>
</form>
